<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Thuốc</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <!-- Font Awesome for pill icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .medicine-card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            padding: 15px;
            text-align: center;
            transition: transform .3s ease, box-shadow .3s ease
        }

            .medicine-card:hover {
                transform: translateY(-5px);
                box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.15)
            }

        .pill-icon {
            font-size: 48px;
            color: #000;
            margin-bottom: 10px;
        }

        .medicine-card h5 {
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 10px
        }

        .medicine-card p {
            color: #666;
            font-size: .9rem
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="container mt-3">
            <a href="{% url 'afterlogin' %}" class="btn btn-outline-primary">
                <i class="fas fa-arrow-left"></i> Quay lại trang chính
            </a>
        </div>
        <div class="row mb-4">
            <div class="col-md-6 offset-md-3">
                <input type="text" id="searchInput" class="form-control" placeholder="Tìm theo tên, hãng hoặc chức năng...">
            </div>
        </div>
        <div class="container mt-4">
            <h2 style="margin-bottom: 20px;">Danh Sách Thuốc</h2>
            <div class="row" id="medicine-list">
                {% for medicine in medicines %}
                <div class="col-md-3 mb-4">
                    <div class="medicine-card">
                        <i class="fas fa-capsules pill-icon"></i>
                        <h5>{{ medicine.name }}</h5>
                        <p><strong>Hãng:</strong> {{ medicine.brand }}</p>
                        <p><strong>Chức năng:</strong> {{ medicine.description }}</p>
                        <p><strong>Số lần uống/ngày:</strong> {{ medicine.times_per_day }}</p>
                        <p><strong>{{ medicine.price }} đ / viên</strong></p>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
    {% include "footer.html" %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('searchInput').addEventListener('input', function () {
            const query = this.value.toLowerCase();
            const cards = document.querySelectorAll('#medicine-list .medicine-card');

            cards.forEach(card => {
                const name = card.querySelector('h5').textContent.toLowerCase();
                const brand = card.querySelector('p:nth-of-type(1)').textContent.toLowerCase();
                const description = card.querySelector('p:nth-of-type(2)').textContent.toLowerCase();

                if (name.includes(query) || brand.includes(query) || description.includes(query)) {
                    card.closest('.col-md-3').style.display = '';
                } else {
                    card.closest('.col-md-3').style.display = 'none';
                }
            });
        });
    </script>

</body>
</html>
