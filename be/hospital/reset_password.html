<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đặt lại mật khẩu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .otp-container {
      max-width: 500px;
      margin: 40px auto;
      padding: 30px 25px;
      background-color: #519ca4;
      color: white;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.15);
      text-align: center;
      font-family: Arial, sans-serif;
    }

    .otp-box {
      background-color: #b3e5fc;
      color: #2c3e50;
      padding: 25px 20px;
      border-radius: 10px;
      margin-top: 20px;
    }

    button[type="submit"] {
      background-color: #2c3e50;
      border-color: #2c3e50;
      font-weight: 700;
      padding: 10px 30px;
      margin-top: 20px;
      border-radius: 10px;
      color: white;
    }

    button[type="submit"]:hover {
      background-color: #1a2730;
      border-color: #1a2730;
    }
  </style>
</head>
<body>

  <div class="otp-container">
    <h3>Đặt lại mật khẩu</h3>
    <div class="otp-box">
      <form method="post">
        {% csrf_token %}
        <label for="new_password" class="form-label fw-semibold">Nhập mật khẩu mới:</label>
        <input type="password" name="new_password" id="new_password" class="form-control mb-3" required>

        <label for="confirm_password" class="form-label fw-semibold">Xác nhận mật khẩu:</label>
        <input type="password" name="confirm_password" id="confirm_password" class="form-control" required>

        <button type="submit" class="btn btn-primary">Đổi mật khẩu</button>
      </form>
    </div>
  </div>

  <!-- Toasts -->
  <div aria-live="polite" aria-atomic="true" class="position-fixed bottom-0 end-0 p-3" style="z-index: 9999;">
    {% for message in messages %}
    <div class="toast show text-white border-0 mb-2
         {% if 'success' in message.tags %} bg-success
         {% elif 'error' in message.tags %} bg-danger
         {% elif 'info' in message.tags %} bg-info
         {% else %} bg-secondary
         {% endif %}"
         role="alert" aria-live="assertive" aria-atomic="true"
         data-bs-delay="4000" data-bs-autohide="true">
      <div class="d-flex">
        <div class="toast-body">
          {{ message }}
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
    {% endfor %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const toastElList = [].slice.call(document.querySelectorAll('.toast'));
      toastElList.forEach(function (toastEl) {
        new bootstrap.Toast(toastEl).show();
      });
    });
  </script>
</body>
</html>
