<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Xác thực OTP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    .otp-container {
      max-width: 500px;
      margin: 40px auto;
      padding: 30px 25px;
      background-color: #519ca4;
      color: white;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.15);
      text-align: center;
      font-family: Arial, sans-serif;
    }

    .otp-box {
      background-color: #b3e5fc;
      color: #2c3e50;
      padding: 25px 20px;
      border-radius: 10px;
      margin-top: 20px;
    }

    .otp-container h3 {
      margin-bottom: 15px;
      font-weight: 700;
      font-size: 28px;
    }

    input[name="otp"] {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 8px;
      text-align: center;
      color: #2c3e50;
      background-color: #e1f0fb;
      border: 2px solid #2c3e50;
      border-radius: 8px;
      padding: 10px 0;
      width: 100%;
      max-width: 280px;
      margin: 10px auto 0 auto;
      display: block;
    }

    button[type="submit"] {
      background-color: #2c3e50;
      border-color: #2c3e50;
      font-weight: 700;
      padding: 10px 30px;
      margin-top: 20px;
      border-radius: 10px;
      color: white;
    }

    button[type="submit"]:hover {
      background-color: #1a2730;
      border-color: #1a2730;
    }
  </style>
</head>

<body>

  <div class="otp-container">
    <h3>Xác thực Email</h3>
    <div class="otp-box">
      <form method="post" novalidate>
        {% csrf_token %}
        <label for="otp" class="form-label fw-semibold">Tài khoản của bạn được được bật Xác thực 2 yếu tố. Vui lòng nhập mã đã được gửi đến email của bạn.</label>
        <input type="text" name="otp" id="otp" class="form-control" required maxlength="6" inputmode="numeric" pattern="\d{6}" autocomplete="one-time-code" placeholder="______">
        <button type="submit" name="otp_submit" class="btn btn-primary">Hoàn tất đăng nhập</button>
      </form>
    </div>
    <br><br>
    <p class="footer-note">
      Nếu bạn không yêu cầu đăng nhập, hãy đổi mật khẩu của bạn ngay lập tức.
      <br>
      <a href="{% url 'patientlogin' %}" style="color: white; text-decoration: underline;">Quay lại trang đăng nhập</a>
    </p>
  </div>

  <!-- Toasts -->
  <div aria-live="polite" aria-atomic="true" class="position-fixed bottom-0 end-0 p-3" style="z-index: 9999;">
    {% for message in messages %}
    <div class="toast show text-white border-0 mb-2
         {% if 'success' in message.tags %} bg-success
         {% elif 'error' in message.tags %} bg-danger
         {% elif 'info' in message.tags %} bg-info
         {% else %} bg-secondary
         {% endif %}"
         role="alert" aria-live="assertive" aria-atomic="true"
         data-bs-delay="4000" data-bs-autohide="true">
      <!-- <div class="toast align-items-center text-white bg-{{ message.tags }} border-0 mb-2" role="alert" data-bs-delay="4000" data-bs-autohide="true"> -->
        <div class="d-flex">
          <div class="toast-body">
            {{ message }}
          </div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
      </div>
    {% endfor %}
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Auto-show toasts -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const toastElList = [].slice.call(document.querySelectorAll('.toast'));
      toastElList.forEach(function (toastEl) {
        new bootstrap.Toast(toastEl).show();
      });
    });
  </script>

</body>
</html>
