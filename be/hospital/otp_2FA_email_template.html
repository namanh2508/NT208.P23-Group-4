<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <style>
    body { background-color: #519ca4; font-family: Arial, sans-serif; margin: 0; padding: 0; }
    .container { max-width: 700px; margin: auto; padding: 30px 20px; background-color: #519ca4; color: white; text-align: center; border-radius: 10px; }
    .otp-box { background-color: #b3e5fc; color: #2c3e50; padding: 30px; border-radius: 10px; margin: 20px 0; }
    h1 { font-size: 24px; color: white; }
    .otp { font-size: 32px; font-weight: bold; color: #2c3e50; letter-spacing: 4px; margin-top: 10px; }
    .footer { font-size: 14px; margin-top: 30px; color: #ffffff; }
  </style>
</head>
<body>
  <div class="container">
    <h1>IV-MEDICAL</h1>
    <div class="otp-box">
      <h2>Yêu cầu đăng nhập cần xác thực</h2>
      <p>Để hoàn tất đăng nhập vào tài khoản của bạn, vui lòng sử dụng mã xác thực dưới đây.</p>
      <div class="otp">{{ otp }}</div>
      <p style="margin-top: 20px; color: #2c3e50;">Mã này chỉ có hiệu lực trong 5 phút.</p>
    </div>
    <p class="footer">
      Nếu bạn không yêu cầu thay đổi này, vui lòng liên hệ bộ phận hỗ trợ ngay lập tức.<br>
      Vui lòng không trả lời email này.
    </p>
  </div>
</body>
</html>
