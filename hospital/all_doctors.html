<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách bác sĩ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <style>
      .doctor-card {
        background: #fff;
        border-radius: 10px;
        box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        padding: 15px;
        text-align: center;
        transition: transform .3s ease, box-shadow .3s ease
      }

      .doctor-card:hover {
        transform: translateY(-5px);
        box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.15)
      }

      .doctor-card img {
        width: 100px;
        height: 100px;
        border-radius: 50%;
      }

      .doctor-card h5 {
        font-size: 1.1rem;
        font-weight: bold;
        margin-top: 10px
      }

      .doctor-card p {
        color: #666;
        font-size: .9rem
      }
    </style>
  </head>
  <body>
    <div class="wrapper"> {% include 'patient_navbar.html' %} <div class="container mt-4">
        <h2 style="margin-bottom: 20px;">Danh Sách Bác Sĩ</h2>
        <div class="row" id="doctor-list">
          {% for doctor in doctors %}
    <div class="col-md-3 mb-4">
        <a href="{% url 'doctor_detail' doctor.id %}" class="doctor-card-link" style="text-decoration: none; color: inherit;"> 
            <div class="doctor-card">
                <img src="{{ doctor.profile_pic.url }}" alt="Doctor Image">
                <h5>{{ doctor.user.last_name }} {{ doctor.user.first_name }}</h5>
                <p>{{ doctor.get_department_display }}</p>
            </div>
        </a>
    </div>
{% endfor %}
        </div>
      </div>
    </div> {% include "footer.html" %} <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
  </body>
</html>
