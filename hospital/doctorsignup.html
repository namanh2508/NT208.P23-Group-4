<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bệnh viện IV-MED</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    /* Reset CSS */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
    }
    .wrapper {
      min-height: 100%;
      display: flex;
      flex-direction: column;
    } 
    .content {
      flex: 1; /* Đẩy footer xuống */
    }

    .form-container {
      max-width: 600px;
      margin: 2rem auto;
      padding: 2rem;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    h2 {
      color: #4f8cd1;
      text-align: center;
      margin-bottom: 2rem;
      font-size: 30px;
      font-weight: bold;
    }

    /* Nhóm form */
    .form-group {
      margin-bottom: 1.5rem;
      display: grid;
      grid-template-columns: 120px 1fr;
      align-items: center;
      gap: 1rem;
    }

    label {
      font-weight: 500;
      color: #34495e;
      text-align: left;
    }

    .form-control {
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-bottom: 2px solid #69a1c7;
      border-radius: 8px;
      transition: border-color 0.3s ease;
    }

    .form-control:focus {
      box-shadow: 0 0 10px rgba(0, 123, 255, 0.5);
      border-color: #0056b3;
    }

    /* Radio group */
    .radio-group {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .form-check {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Nút đăng ký */
    .btn-register {
      width: 100%;
      padding: 0.75rem;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .btn-register:hover {
      background: #2980b9;
      transform: scale(1.05);
      transition: all 0.3s ease-in-out;
    }

    /* Responsive */
    @media (max-width: 640px) {
      .form-group {
        grid-template-columns: 1fr;
        gap: 0.5rem;
      }

      label {
        text-align: left;
      }

      .form-container {
        margin: 1rem;
        padding: 1.5rem;
      }
    }
    a:hover {
      cursor: pointer;
      color: rgb(73, 133, 133) !important;
    }
  </style>
</head>
<body>
  {% include "navbar.html" %}
  <div class="form-container">
    <h2>Doctor Registration</h2>
    <form method="post" novalidate>
      {% csrf_token %}
      
      <!-- Username -->
      <div class="form-group">
        <label for="id_username">Username</label>
        <input type="text" class="form-control" id="id_username" placeholder="Enter your username">
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="id_email">Email</label>
        <input type="email" class="form-control" id="id_email" placeholder="Enter your email">
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="id_password">Password</label>
        <input type="password" class="form-control" id="id_password" placeholder="Enter your password">
      </div>

      <!-- Date of Birth -->
      <div class="form-group">
        <label for="id_dob">Date of birth</label>
        <input type="date" class="form-control" id="id_dob">
      </div>

      <!-- Biological sex -->
      <div class="form-group">
        <label>Biological sex</label>
        <div class="radio-group">
          <div class="form-check">
            <input type="radio" name="bsex" id="male">
            <label for="male">Male</label>
          </div>
          <div class="form-check">
            <input type="radio" name="bsex" id="female">
            <label for="female">Female</label>
          </div>
        </div>
      </div>

      <button type="submit" class="btn-register">Register</button>
      <!-- Login link -->
          <div class="text-center mt-3">
              <span>Already have an account?</span> 
                <a href="{% url 'doctorlogin' %}" class="text-primary fw-bold ms-2">Login now!</a>
          </div>
    </form>
  </div>
  {% include "footer.html" %}
</body>
</html>
