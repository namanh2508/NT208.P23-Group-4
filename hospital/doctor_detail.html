<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Tin Bác Sĩ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
  </head>
  <body>
    {% load static %}
    <div class="wrapper"> {% include 'patient_navbar.html' %} <div class="container mt-4">
        <div class="container mt-5">
            <h1 class="mb-4">Thông tin bác sĩ</h1>
            <div class="card shadow-sm">
                <div class="row g-0">
                    <div class="col-md-4 d-flex justify-content-center align-items-center">
                    <img src="{{ doctor.get_picture }}" alt="Doctor Image" class="img-fluid rounded-circle p-3" style="max-width: 200px; max-height: 200px; object-fit: cover;">
                    </div>
                    <div class="col-md-8">
                        <div class="card-body">
                            <h5 class="card-title">Bác sĩ {{ doctor.user.get_full_name }}</h5>
                            <p class="card-text"><small class="text-muted">Khoa: {{ doctor.get_department }}</small></p>
                            <p class="card-text">Mô tả: {{ doctor.description }} </p>
                            <div class="d-grid gap-2 d-md-block">
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div >
            
        </div>
        <div class="row mt-3">
            <button class="btn btn-secondary me-auto col-3 " type="button"><a href="{% url 'all_doctors' %}" style="color: white; text-decoration: none; font-weight: 700;"><i class="fa-solid fa-backward"></i> Quay lại danh sách bác sĩ</a></button>
            <button type="button" class="col-3 btn btn-success me-auto"> 
                <i class="fas fa-calendar-check me-1"></i> 
                <a href=" " style="color: white; text-decoration: none; font-weight: 700;">Đặt lịch khám bệnh</a>
            </button>
            <button type="button" class="col-3 btn btn-info"> 
                <i class="fas fa-headset me-1"></i> 
                <a href=" " style="color: white; text-decoration: none; font-weight: 700;">Nhận tư vấn</a>
            </button>
        </div>
    </div> 
    {% include "footer.html" %} 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
  </body>
</html>
