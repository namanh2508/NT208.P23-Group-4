<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prescripto</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      display: flex;
      flex-direction: column;
    }

    .wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .footer {
      background-color: #f8f9fa;
      padding: 10px 0;
      text-align: center;
      margin-top: auto; /* Đẩy footer xuống cuối */
    }

    .navbar-nav .nav-link {
      color: white;
      margin-right: 20px;
      transition: color 0.3s ease;
    }

    .navbar-nav .nav-link:hover {
      color: #FFD700;
    }

    .btn-profile {
      background: none;
      border: none;
      padding: 0;
    }

    .profile-icon {
      width: 24px; /* Giảm kích thước */
      height: 24px;
    }

    /* --- CSS ĐÃ SỬA --- */
    .navbar-nav .nav-item {
      position: relative; /* Đặt gốc định vị cho menu con */
      /* Các thuộc tính khác giữ nguyên nếu có */
    }

    #sidebarMenu {
      position: absolute;
      top: 100%; /* Hiển thị ngay bên dưới biểu tượng profile */
      right: 0; /* Căn lề phải với biểu tượng profile */
      z-index: 1000; /* Đảm bảo menu hiển thị trên các phần tử khác */
      /* Width sẽ được xác định bởi .sidebar bên trong */
      /* display: none; sẽ được quản lý bởi class .collapse của Bootstrap */
    }

    .sidebar {
      background-color: #f8f9fa;
      padding: 5px; /* Giảm padding */
      border-radius: 8px;
      width: 120px; /* Giảm chiều rộng */
      text-align: center;
      /* Thêm một chút bóng đổ để menu nổi bật hơn (tùy chọn) */
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    /* --- KẾT THÚC CSS ĐÃ SỬA --- */

    .sidebar-nav .nav-link {
      color: #6c757d; /* Màu mặc định, nhưng sẽ bị ghi đè bởi style inline */
      padding: 5px 10px;
      font-size: 12px; /* Giảm kích thước chữ */
    }

    /* Đảm bảo các liên kết trong sidebar mới có màu đen như bạn muốn */
    /* Có thể thêm selector này nếu style inline không hoạt động */
    /*
    #sidebarMenu .sidebar-nav a.nav-link {
        color: black !important;
    }
    */

  </style>
</head>
<body>
  <div class="wrapper">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand fw-bold" href="/IV-Medical">IV MEDICAL</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="/IV-Medical">HOME</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">ALL DOCTORS</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">ABOUT</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">CONTACT</a>
            </li>
            <li class="nav-item">
              <button class="btn-profile" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu" aria-expanded="false" aria-controls="sidebarMenu">
                <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" class="profile-icon" alt="Profile">
              </button>
              <div class="collapse" id="sidebarMenu">
                <div class="sidebar">
                  <div class="sidebar-nav">
                    <a href="/IV-Medical" style="color: black;" class="nav-link d-block">My Profile</a>
                    <a href="{% url 'patient_appointments' request.user.first_name %}" style="color: black;" class="nav-link d-block">My Appointments</a>
                    <a href="logout" style="color: black;" class="nav-link d-block">Logout</a>
                  </div>
                </div>
              </div>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <<div class="container mt-4">
      <h2>Danh Sách Bác Sĩ</h2>
      <div class="row" id="doctor-list"> 
          <!-- Dữ liệu bác sĩ sẽ được thêm ở đây -->
      </div>
  </div>
  
  <script>
      async function fetchDoctors() {
          try {
              let response = await fetch("/api/doctor/");
              let data = await response.json();
              let doctorList = document.getElementById("doctor-list");
  
              // Xóa nội dung cũ trước khi thêm mới
              doctorList.innerHTML = "";
  
              // Duyệt qua danh sách bác sĩ và hiển thị
              data.forEach(doctor => {
                  let card = `
                      <div class="col-md-2 mb-4 d-flex justify-content-center">
                          <div class="text-center">
                              <a href="/IV-Medical/doctor/${doctor.id}/">
                                  <img src="${doctor.profile_pic}" alt="Doctor Image" style="width: 120px; height: 120px; border-radius: 50%;">
                              </a>
                              <h5 class="mt-2">${doctor.user.last_name} ${doctor.user.first_name}</h5>
                              <p>${doctor.department}</p>
                          </div>
                      </div>
                  `;
                  doctorList.innerHTML += card;
              });
          } catch (error) {
              console.error("Lỗi khi tải danh sách bác sĩ:", error);
          }
      }
  
      // Gọi hàm fetchDoctors khi trang web tải xong
      window.onload = fetchDoctors;
  </script>
  

  </div> {% include "footer.html" %} <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
