<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prescripto</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
  <style>
    html, body {
  height: 100%;
  margin: 0;
  display: flex;
  flex-direction: column;
}

.wrapper {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.footer {
  background-color: #f8f9fa;
  padding: 10px 0;
  text-align: center;
  margin-top: auto; /* Đẩy footer xuống cuối */
}
    .navbar-nav .nav-link {
      color: white;
      margin-right: 20px;
      transition: color 0.3s ease;
    }

    .navbar-nav .nav-link:hover {
      color: #FFD700;
    }

    .btn-profile {
      background: none;
      border: none;
      padding: 0;
    }

    .profile-icon {
      width: 24px; /* Giảm kích thước */
      height: 24px;
    }

    .sidebar {
      background-color: #f8f9fa;
      padding: 5px; /* Giảm padding */
      border-radius: 8px;
      width: 120px; /* Giảm chiều rộng */
      text-align: center;
    }

    .sidebar-nav .nav-link {
      color: #6c757d;
      padding: 5px 10px;
      font-size: 12px; /* Giảm kích thước chữ */
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand fw-bold" href="/IV-Medical">IV MEDICAL</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="/IV-Medical">HOME</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">ALL DOCTORS</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">ABOUT</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">CONTACT</a>
            </li>
            <li class="nav-item">
              <button class="btn-profile" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu">
                <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" class="profile-icon" alt="Profile">
              </button>
              <div class="collapse" id="sidebarMenu">
                <div class="sidebar">
                  <div class="sidebar-nav" >
                    <a href="/IV-Medical" style="color: black;" class="nav-link">My Profile</a>
                    <a href="#" style="color: black;" class="nav-link">My Appointments</a>
                    <a href="logout" style="color: black;" class="nav-link">Logout</a>
                  </div>
                </div>
              </div>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </div>

  {% include "footer.html" %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
