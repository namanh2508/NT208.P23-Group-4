    body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        .tabs {
            margin-top: 60px;
            margin-bottom: 40px;
            margin: 40px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e0f2ff;
            border-radius: 30px;
            padding: 8px;
            width: 700px;
            height: 60px;
            align-items: center;
        }
        .tab {
            display: flex;
            flex: 1;
            text-align: center;
            justify-content: center;
            padding: 12px 10px;
            cursor: pointer;
            border-radius: 25px;
            transition: background 0.3s;
            font-size: 20px;
            font-weight: bold;
            height: 40px;
            position: relative;
            height: 45px;
        }
        input[name="tab"] {
            display: none;
        }
         input[name="tab"]:checked + label {
            background: white;
            font-weight: bold;
            padding: 12px 10px;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
            transition: all 0.3s;
            box-shadow: none;
            font-size: 18px;
            height: 45px;
            border: 2px solid #a3c2e8;
        }
        input[name="tab"] {
            display: none;
        }
        .form-container {
            width: 600px;
            padding: 20px;
            background: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 5px;
            margin-top: 280px;
            /* margin-bottom: 50px; */
            position: absolute;
            top: 45%;
            left: 50%; 
            /* margin: 50px auto;
            position: relative;
            top: auto;
            left: auto;
            transform: none; */
            /* display: flex;
            flex-direction: column;
            align-items: center; */
            transform: translate(-50%, -50%); 
        }
        h3 {
          text-align: center;
          margin-bottom: 50px;
        }
        .form-section {
            display: none;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        .form-section input {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-bottom: 2px solid #ccc;
            border-radius: 5px;
            outline: none;
            font-size: 16px;
            background: transparent;
            transition: border-bottom 0.3s ease-in-out, transform 0.2s;
            margin-bottom: 20px;
        }
        .form-section input:hover {
            border-bottom: 2px solid #89b3e0;
            transform: scale(1.02);
        }
        .form-section input:focus {
            border-bottom: 2px solid #e5425b;
            transform: scale(1.05);
        }
        .form-section button {
          width: 20%;
          margin-top: 10px;
          padding: 10px;
          border: none;
          border-radius: 5px;
          background-color: #6d99c8;
          color: white;
          font-size: 18px;
          cursor: pointer;
          transition: background 0.3s;
        }

        .form-section button:hover {
          background-color: #0056b3;
        }
        .form-container div {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    margin-bottom: 10px; /* Khoảng cách giữa các dòng */
}
.form-container label {
    width: 150px; /* Độ rộng cố định giúp label thẳng hàng */
    font-weight: bold;
    text-align: left;
    margin-right: 5px; /* Khoảng cách giữa label và input */
}
.form-container input {
    flex: 1; /* Giúp input mở rộng theo chiều ngang */
    padding: 8px;
    border-bottom: 1px solid #ccc;
    border-radius: 5px;
}

        #admin:checked ~ .form-container .admin-form,
        #doctor:checked ~ .form-container .doctor-form,
        #patient:checked ~ .form-container .patient-form {
            display: block;
            opacity: 1;
        }

    <div class="form-container">
      <form method="post">
          {% csrf_token %}
          <div class="form-section admin-form">
              <h3>Admin Signup</h3>
              
              {% for field in form %}
                  <div>
                      {{ field.label_tag }}
                      {{ field }}
                      {% if field.errors %}
                          <small style="color: red;">{{ field.errors|striptags }}</small>
                      {% endif %}
                  </div>
              {% endfor %}
              
              <button type="submit" name="submit-btn">Sign Up</button><br>
          </div>
      </form>
