<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chatbot</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    #chat-toggle {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
        width: 60px;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s ease-in-out, box-shadow 0.2s;
        background-color: #0d6efd;
        border: none;
    }
    
    #chat-toggle:hover {
        transform: scale(1.1);
        box-shadow: 0 0 10px rgba(13, 110, 253, 0.6);
    }

    #chat-popup {
      position: fixed;
      bottom: 100px;
      right: 20px;
      width: 400px;
      max-height: 500px;
      border: 1px solid #dee2e6;
      border-radius: 10px;
      background-color: #fff;
      display: none;
      flex-direction: column;
      z-index: 1001;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    #chat-header {
      padding: 10px;
      background-color: #0d6efd;
      color: #fff;
      font-weight: bold;
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      background-color: #f8f9fa;
    }

    .chat-message { 
        margin-bottom: 10px; 
        word-wrap: break-word;
        white-space: pre-wrap;
        overflow-wrap: break-word;
    }
    .user { font-weight: bold; color: #0d6efd; }
    .bot { font-weight: bold; color: #198754; }

    #chat-input {
      padding: 10px;
      border-top: 1px solid #dee2e6;
    }

    #chat-popup input {
      width: calc(100% - 70px);
    }

    #chat-popup button.send-btn {
      width: 60px;
    }
  </style>
</head>
<body>

<button class="btn btn-primary rounded-circle" id="chat-toggle">
    <i class="bi bi-chat-fill" style="font-size: 32px; color: white;"></i>
</button>

<div id="chat-popup" class="d-none flex-column">
  <div id="chat-header">
    <span>Trợ lý AI</span>
    <div>
        <button type="button" class="btn btn-sm" id="chat-close" style="color: #226ad6; background-color: #ffffff; border: none;">✖</button>
    </div>
  </div>
  <div id="chat-box">
    <div id="loading-message" class="chat-message text-muted" style="display: none;">
        <span class="bot">Trợ lý AI:</span> <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Đang suy nghĩ...
      </div>
  </div>
  <div id="chat-input" class="d-flex">
    <textarea id="message-input" class="form-control me-2" rows="1" placeholder="Nhập câu hỏi của bạn..." style="resize: none; overflow: hidden;"></textarea>
    <button class="btn btn-success send-btn" id="send-button">Gửi</button>
  </div>
  <div class="p-2 text-muted" style="font-size: 0.85rem; border-top: 1px solid #dee2e6;">
    ⚠️ Trợ lý AI chỉ hỗ trợ tham khảo. Không chịu trách nhiệm với các quyết định dựa trên phản hồi từ hệ thống.
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  $(document).ready(function () {
    $(document).on('click', '#chat-toggle', function () {
        $('#chat-popup').toggleClass('d-none d-flex');
    });

    $(document).on('click', '#chat-close', function () {
        $('#chat-popup').addClass('d-none').removeClass('d-flex');
    });
    $('#message-input').on('input', function () {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight) + 'px';
    });

    $('#send-button').click(function () {
      let message = $('#message-input').val().trim();
      if (!message) return;

      $('#chat-box').append(`<div class="chat-message"><span class="user">Bạn:</span> ${message}</div>`);
      $('#chat-box').append($('#loading-message').show());
      $('#message-input').val("");
      $('#chat-box').scrollTop($('#chat-box')[0].scrollHeight);

      $.ajax({
        url: "/api/chat/",
        type: "POST",
        contentType: "application/json",
        data: JSON.stringify({ message: message }),
        success: function (data) {
            $('#loading-message').hide();
            $('#chat-box').append(`<div class="chat-message"><span class="bot">Trợ lý AI:</span> ${data.reply}</div>`);
            $('#chat-box').scrollTop($('#chat-box')[0].scrollHeight);
        },
        error: function (xhr) {
            $('#loading-message').hide();
            let errorMsg = "Có gì đó không ổn. Bạn hãy quay lại sau nhé!";
            try {
                const res = JSON.parse(xhr.responseText);
                if (res.error) errorMsg = res.error;
            } catch (e) {}
            $('#chat-box').append(`<div class="chat-message text-danger"><span class="bot">Lỗi:</span> ${errorMsg}</div>`);
        }
      });
    });

    $('#message-input').keypress(function (e) {
      if (e.which == 13) {
        $('#send-button').click();
        return false;
      }
    });
  });
</script>
</body>
</html>
