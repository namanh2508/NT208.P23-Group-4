  {% extends 'admin_base.html' %}
  {% block content %}
  {%load static%}

  <head>
    <link href="//netdna.bootstrapcdn.com/bootstrap/3.0.0/css/bootstrap.min.css" rel="stylesheet" id="bootstrap-css">
    <script src="//netdna.bootstrapcdn.com/bootstrap/3.0.0/js/bootstrap.min.js"></script>
    <script src="//code.jquery.com/jquery-1.11.1.min.js"></script>

    <style media="screen">
      a:link {
        text-decoration: none;
      }

      h6 {
        text-align: center;
      }

      .row {
        margin: 100px;
      }
    </style>
  </head>

  <div class="container">
    <div class="panel panel-primary">
      <div class="panel-heading">
        <h6 class="panel-title">Danh sách</h6>
      </div>
      <table class="table table-hover" id="dev-table">
        <thead>
          <tr>

            <th>Tên</th>
            <th>Ảnh</th>
            <th>Liên lạc</th>
            <th>Chuyên môn</th>
            <th>Sửa</th>
            <th>Xóa</th>
          </tr>
        </thead>
        {% for d in doctors %}
        <tr>

          <td> {{d.user.get_full_name}}</td>
          <td> <img src="{{ d.get_picture }}" alt="Profile Pic" height="40px" width="40px" /></td>
          <td>{{d.user.phone}}</td>
          <td>{{d.get_department_display}}</td>
          <td><a class="btn btn-primary btn-xs" href="{% url 'update-doctor' d.id  %}"><span class="glyphicon glyphicon-edit"></span></a></td>
          <td><a class="btn btn-danger btn-xs" href="{% url 'delete-doctor-from-hospital' d.id  %}"><span class="glyphicon glyphicon-trash"></span></a></td>
        </tr>
        {% endfor %}
      </table>
    </div>
  </div>


  {% endblock content %}
